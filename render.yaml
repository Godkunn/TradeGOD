# render.yaml
# ============================================================
# Render.com deployment configuration
# Free tier: Use "background worker" type (not web service)
# so it never spins down.
# ============================================================

services:
  - type: web              # Web Service — compatible with Render Free Tier
    name: tradegod-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --binance
    envVars:
      - key: BINANCE_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: BINANCE_SECRET_KEY
        sync: false
      - key: BINANCE_MODE
        value: testnet       # Change to "live" when ready
      - key: SYMBOL
        value: BTCUSDT
      - key: CAPITAL_USDT
        value: "10"
      - key: RISK_PER_TRADE
        value: "0.02"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
